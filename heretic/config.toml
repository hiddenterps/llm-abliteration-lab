# Heretic 2.1 config for a small CPU-only educational run
# on Qwen/Qwen2.5-0.5B-Instruct (8 cores, 16 GB RAM, no GPU).
#
# Default Heretic 2.x modifier is ARA (Arbitrary-Rank Ablation).
# We explicitly select the classic Abliteration modifier so the
# result is comparable to our hand-written directional ablation.
# Trial and prompt counts are reduced so the run can finish in
# well under 40 minutes on CPU.

dtypes = ["bfloat16", "float32"]
quantization = "none"
device_map = "cpu"
offload_outputs_to_cpu = true
batch_size = 1
max_batch_size = 2
max_response_length = 48
print_debug_information = true

scorers = [
    { plugin = "heretic.scorers.keyword_rate.KeywordRate", optimization = "minimize" },
    { plugin = "heretic.scorers.kl_divergence.KLDivergence", optimization = "minimize" },
]

modifiers = [
    { plugin = "heretic.modifiers.abliteration.Abliteration" },
]

n_trials = 12
n_startup_trials = 5
study_checkpoint_dir = "checkpoints"
modified_model_type = "decensored"
max_shard_size = "5GB"
system_prompt = "You are a helpful assistant."
enable_shell = false

[batch_size_test_prompts]
dataset = "mlabonne/harmless_alpaca"
split = "train[:8]"
column = "text"

[[response_prefix_test_prompts]]
dataset = "mlabonne/harmless_alpaca"
split = "train[:8]"
column = "text"

[[response_prefix_test_prompts]]
dataset = "mlabonne/harmful_behaviors"
split = "train[:8]"
column = "text"

[scorer.KeywordRate]
score_name = "Refusals"
print_responses = false

[scorer.KeywordRate.prompts]
dataset = "mlabonne/harmful_behaviors"
split = "test[:16]"
column = "text"

[scorer.KLDivergence.prompts]
dataset = "mlabonne/harmless_alpaca"
split = "test[:16]"
column = "text"

[modifier.Abliteration]
orthogonalize_direction = true
row_normalization = "full"
full_normalization_lora_rank = 3
winsorization_quantile = 1.0

[modifier.Abliteration.good_prompts]
dataset = "mlabonne/harmless_alpaca"
split = "train[:48]"
column = "text"

[modifier.Abliteration.bad_prompts]
dataset = "mlabonne/harmful_behaviors"
split = "train[:48]"
column = "text"
